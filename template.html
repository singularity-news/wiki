<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- meta injected by build.py above </head> -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<meta property="og:image" content="https://raw.githubusercontent.com/singularity-news/wiki/57d6999f3aa1e574cc45619c5ec7b52592d42e61/assets/header.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="overlay" id="overlay" aria-hidden="true"></div>

<!-- ══ TOPBAR ══════════════════════════════════════════════════════════════ -->
<header class="topbar" id="topbar" role="banner">
  <button class="icon-btn" id="menuToggle"
    aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true">
      <rect y="2"  width="18" height="2" rx="1"/>
      <rect y="8"  width="18" height="2" rx="1"/>
      <rect y="14" width="18" height="2" rx="1"/>
    </svg>
  </button>
  <a href="index.html" class="topbar-logo">
    <img src="https://raw.githubusercontent.com/singularity-news/wiki/57d6999f3aa1e574cc45619c5ec7b52592d42e61/assets/logo.png"
         alt="Singularity University Wiki Logo" width="34" height="34" loading="lazy">
    <div class="logo-text">
      <span class="logo-name">Singularity University</span>
      <span class="logo-sub">KdK Krzb. Online Wiki</span>
    </div>
  </a>
  <div class="topbar-actions">
    <a href="search.html" class="icon-btn" aria-label="Search" title="Search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </a>
    <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1"  x2="12" y2="3"/>  <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22"  y1="4.22"  x2="5.64"  y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1"  y1="12" x2="3"  y2="12"/>  <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22"  y1="19.78" x2="5.64"  y2="18.36"/>
        <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
      </svg>
    </button>
    <a href="https://github.com/singularity-news/wiki" class="icon-btn" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.54-1.38-1.33-1.74-1.33-1.74-1.09-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.48.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02.005 2.04.14 3 .4 2.28-1.55 3.29-1.23 3.29-1.23.66 1.66.25 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.49 5.92.43.37.82 1.1.82 2.22v3.29c0 .32.22.69.83.57C20.57 21.8 24 17.3 24 12 24 5.37 18.63 0 12 0z"/>
      </svg>
    </a>
  </div>
</header>

<!-- ══ LEFT SIDEBAR ════════════════════════════════════════════════════════ -->
<aside class="sidebar" id="sidebar" role="navigation" aria-label="Article navigation">
  <div class="sidebar-search">
    <input type="search" id="searchInput"
      placeholder="Search articles..." aria-label="Search articles" autocomplete="off">
  </div>
  <div class="sidebar-section">
    <div class="sidebar-label">Articles</div>
    <ul id="articleList" role="list">
      <li class="no-results">Loading...</li>
    </ul>
  </div>
  <nav class="sidebar-links" aria-label="External links">
    <a href="index.html">&#127968; Encyclopedia</a>
    <a href="search.html">&#128269; Search</a>
    <a href="https://kdk-university.netlify.app/" target="_blank" rel="noopener">&#127891; KdK University</a>
    <a href="https://electric-paradise.start.page" target="_blank" rel="noopener">&#9889; Electric Paradise</a>
    <a href="https://singularity-news.github.io/" target="_blank" rel="noopener">&#128240; Singularity News</a>
    <a href="https://et-pioneer.github.io/Electric-Technocracy-Pioneers-Community/search#gsc.tab=0" target="_blank" rel="noopener">&#128269; Unified Search</a>
    <a href="https://github.com/singularity-news/wiki" target="_blank" rel="noopener">&#128230; GitHub</a>
  </nav>
</aside>

<!-- ══ PAGE CONTENT ════════════════════════════════════════════════════════ -->
<div class="page-wrap">

  <nav class="breadcrumbs" id="breadcrumbs" aria-label="Page path"></nav>

  <!-- content-wrap: id used by JS to toggle toc-collapsed class -->
  <div class="content-wrap" id="contentWrap">

    <!-- Article body -->
    <main class="article-col" id="main-content">
      <div class="article-box">
        {html_body}
      </div>
    </main>

    <!-- RIGHT TOC — desktop only, collapsible to zero width -->
    <aside class="toc-col" id="tocCol" aria-label="Table of contents">
      <div class="toc-box">
        <div class="toc-header">
          <span class="toc-title">Contents</span>
          <!-- Collapse button: hides TOC, article fills full width -->
          <button class="toc-toggle" id="tocToggle"
            aria-label="Collapse contents" title="Collapse contents">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true">
              <path d="M9 6L4 1v10L9 6z"/>
            </svg>
          </button>
        </div>
        <ul id="toc" role="list"></ul>
      </div>
    </aside>

  </div><!-- /content-wrap -->

  <!-- Floating re-open button — only visible when TOC is collapsed -->
  <button class="toc-open-btn" id="tocOpenBtn"
    aria-label="Show contents" title="Show contents">
    <svg width="14" height="14" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true">
      <path d="M3 6l5-5v10L3 6z"/>
    </svg>
    <span>Contents</span>
  </button>

{footer}

</div><!-- /page-wrap -->

<script src="assets/app.js"></script>
</body>
</html>
