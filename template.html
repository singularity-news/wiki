<!-- template.html -->

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{title_esc}</title>

<meta name="description" content="{desc_esc}">

<link rel="canonical" href="{page_url}">

<meta name="theme-color" content="#0d1117">

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="assets/style.css">

{schema}

</head>

<body>

<div id="overlay"></div>

<header class="topbar">

  <button id="menuToggle" class="menu-button">
    ☰
  </button>

  <a class="logo" href="encyclopedia.html">
    Encyclopedia
  </a>

  <button id="themeToggle" class="theme-button">
    ◐
  </button>

</header>

<div class="layout">

  <aside class="sidebar" id="sidebar">

    <div class="search-box">

      <input
        id="searchInput"
        type="search"
        placeholder="Search articles..."
      >

    </div>

    <div class="sidebar-links">

      <a href="encyclopedia.html">
        Home
      </a>

      <a href="https://kdk-university.netlify.app/">
        KdK University
      </a>

      <a href="https://electric-paradise.start.page">
        Electric Paradise
      </a>

      <a href="https://github.com/singularity-news/wiki">
        GitHub
      </a>

    </div>

    <div id="articleList"></div>

  </aside>

  <main class="content">

    <article class="article-box">

      {html_body}

    </article>

  </main>

</div>

<script src="assets/app.js"></script>

</body>
</html>
