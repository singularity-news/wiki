# =====================================================
# Singularity University — MediaWiki → GitHub Pages
# Root Mirror (Modell B)
#
# Läuft 2× täglich (00:00 und 12:00 UTC)
# Rendert nur geänderte Seiten als flache HTML-Dateien
# Aktualisiert sitemap.xml und search-index.json
# Kein Backend, kein Webhook, kein PHP nötig
# =====================================================

name: MediaWiki → GitHub Pages Root Mirror

on:
  schedule:
    - cron: "0 0,12 * * *"    # 00:00 und 12:00 UTC täglich
  workflow_dispatch:            # Manuell auslösbar über GitHub UI

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # Berechtigung für git push

    steps:

      # ── 1. Repository auschecken ──────────────────
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Abhängigkeiten installieren ───────────
      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update -q
          sudo apt-get install -y jq curl python3

      # ── 3. Änderungen im Wiki prüfen ─────────────
      - name: Änderungen prüfen
        id: changes
        run: |
          API="https://wiki.free.nf/api.php"
          SINCE_FILE=".last_sync"

          if [ -f "$SINCE_FILE" ]; then
            SINCE=$(cat "$SINCE_FILE")
          else
            SINCE="1970-01-01T00:00:00Z"
          fi

          echo "Prüfe Änderungen seit: $SINCE"

          RESPONSE=$(curl -s --max-time 30 \
            "$API?action=query&list=recentchanges&rcprop=title|timestamp&rclimit=100&format=json")

          if [ -z "$RESPONSE" ] || ! echo "$RESPONSE" | jq -e '.query' > /dev/null 2>&1; then
            echo "Wiki nicht erreichbar oder API-Fehler. Abbruch."
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "$RESPONSE" > recent.json

          COUNT=$(jq "[.query.recentchanges[] | select(.timestamp > \"$SINCE\")] | length" recent.json)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Geänderte Seiten seit letztem Sync: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            # Titel extrahieren und Namespaces filtern (nur Hauptartikel)
            jq -r ".query.recentchanges[] | select(.timestamp > \"$SINCE\") | .title" recent.json \
              | grep -v '^Special:' \
              | grep -v '^MediaWiki:' \
              | grep -v '^File:' \
              | grep -v '^Template:' \
              | grep -v '^Category:' \
              | sort -u > pages.txt
            echo "Folgende Artikel werden aktualisiert:"
            cat pages.txt
          fi

      # ── 4. Geänderte Seiten rendern ───────────────
      - name: Geänderte Seiten rendern
        if: steps.changes.outputs.count != '0'
        run: |
          API="https://wiki.free.nf/api.php"
          ERRORS=0

          while IFS= read -r TITLE; do
            [ -z "$TITLE" ] && continue

            # Dateiname normalisieren (Leerzeichen zu Unterstrich, Sonderzeichen entfernen)
            SAFE=$(echo "$TITLE" | tr ' ' '_' | sed 's/[^a-zA-Z0-9_äöüÄÖÜß-]//g')
            FILE="${SAFE}.html"

            # URL-Encoding für den API-Aufruf via Python
            ENCODED_TITLE=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TITLE")

            # HTML-Inhalt von MediaWiki holen
            RAW_HTML=$(curl -s --max-time 30 \
              "$API?action=parse&page=${ENCODED_TITLE}&prop=text&format=json" \
              | jq -r '.parse.text["*"] // empty')

            if [ -z "$RAW_HTML" ]; then
              echo "⚠ Fehler beim Rendering von '$TITLE' – übersprungen."
              ERRORS=$((ERRORS+1))
              continue
            fi

            # Escaping für Meta-Tags
            TITLE_ESC=$(echo "$TITLE" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')
            DESC=$(echo "$RAW_HTML" | sed 's/<[^>]*>//g' | tr '\n' ' ' | sed 's/  */ /g' | cut -c1-300)
            DESC_ESC=$(echo "$DESC" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')

            # HTML-Datei schreiben (Heredoc ermöglicht Variablen-Expansion)
            cat > "$FILE" <<HTMLEOF
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="D-u4byZG_DrIUxnTLQdS0BOTjJcwWmm_h-HwUXl8HO4">
<title>${TITLE_ESC} — Singularity University Wiki</title>
<meta name="description" content="${DESC_ESC}">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://singularity-news.github.io/${SAFE}.html">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<meta property="og:type" content="article">
<meta property="og:title" content="${TITLE_ESC} — Singularity University Wiki">
<meta property="og:description" content="${DESC_ESC}">
<meta property="og:image" content="https://raw.githubusercontent.com/singularity-news/wiki/57d6999f3aa1e574cc45619c5ec7b52592d42e61/assets/header.png">
<meta property="og:url" content="https://singularity-news.github.io/${SAFE}.html">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Article","headline":"${TITLE_ESC}","url":"https://singularity-news.github.io/${SAFE}.html","description":"${DESC_ESC}","publisher":{"@type":"Organization","name":"Singularity University Wiki","url":"https://singularity-news.github.io/"}}
</script>
<link rel="stylesheet" href="assets/style.css">
</head>
