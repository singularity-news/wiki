name: MediaWiki → GitHub Pages Root Mirror

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update -q
          sudo apt-get install -y jq curl python3

      - name: Änderungen im Wiki prüfen
        id: changes
        run: |
          API="https://wiki.free.nf/api.php"

          if [ ! -f .initial_render_done ]; then
            echo "Initialer Lauf – alle Seiten rendern"
            curl -s -H "User-Agent: Mozilla/5.0" \
              "$API?action=query&list=allpages&aplimit=max&format=json" \
              | jq -r '.query.allpages[].title' > pages.txt
            echo "count=$(wc -l < pages.txt)" >> $GITHUB_OUTPUT
            exit 0
          fi

          RESPONSE=$(curl -s -H "User-Agent: Mozilla/5.0" \
            "$API?action=query&list=recentchanges&rcprop=title&rclimit=100&format=json")

          if [ -z "$RESPONSE" ]; then
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "$RESPONSE" \
            | jq -r '.query.recentchanges[].title' \
            | grep -v -E '^(Special:|MediaWiki:|File:|Template:|Category:|User:|Talk:)' \
            | sort -u > pages.txt

          echo "count=$(wc -l < pages.txt)" >> $GITHUB_OUTPUT

      - name: Seiten rendern
        if: steps.changes.outputs.count != '0'
        run: |
          API="https://wiki.free.nf/api.php"

          while IFS= read -r TITLE || [[ -n "$TITLE" ]]; do
            [ -z "$TITLE" ] && continue

            SAFE=$(echo "$TITLE" | tr ' ' '_' | sed 's/[^a-zA-Z0-9_aeoeueAEOEUEss-]//g')
            FILE="${SAFE}.html"

            ENCODED_TITLE=$(python3 - <<EOF
            import urllib.parse,sys
            print(urllib.parse.quote(sys.argv[1]))
            EOF
            "$TITLE")

            ENCODED_TITLE=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TITLE")

            URL="$API?action=parse&page=${ENCODED_TITLE}&prop=text&format=json"

            RAW_JSON=$(curl -s \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64)" \
            -H "Accept: application/json" \
            "$URL" || echo "")

            RAW_JSON=$(curl -s -H "User-Agent: Mozilla/5.0" "$URL" || echo "")
            RAW_HTML=$(echo "$RAW_JSON" | jq -r '.parse.text["*"] // empty')

            [ -z "$RAW_HTML" ] && continue

            {
              echo '<!DOCTYPE html><html lang="de"><head>'
              echo "<title>$TITLE</title>"
              echo '<meta charset="utf-8">'
              echo '<link rel="stylesheet" href="assets/style.css">'
              echo '</head><body>'
              echo "<h1>$TITLE</h1>"
              printf "%s\n" "$RAW_HTML"
              echo '</body></html>'
            } > "$FILE"

            echo "✓ $FILE"
          done < pages.txt

          touch .initial_render_done

      - name: Änderungen committen
        if: steps.changes.outputs.count != '0'
        run: |
          git config user.name "wiki-mirror-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .
          git commit -m "Wiki mirror update" || exit 0
          git push
