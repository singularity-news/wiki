# .github/workflows/wiki-mirror.yml

name: Wiki XML → Encyclopedia Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pandoc python3

      - name: Verify structure
        run: |
          echo "ROOT CONTENTS:"
          ls -la

          echo "BACKUP:"
          ls -la backup || true

          echo "XML:"
          file backup/wiki.xml || true

      - name: Build encyclopedia
        run: |
          python3 build.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
