  <button class="icon-btn" id="menuToggle" aria-label="Menü öffnen" aria-expanded="false" aria-controls="sidebar">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><rect y="2" width="18" height="2" rx="1"/><rect y="8" width="18" height="2" rx="1"/><rect y="14" width="18" height="2" rx="1"/></svg>
  </button>
  <a href="index.html" class="topbar-logo">
    <img src="https://raw.githubusercontent.com/singularity-news/wiki/57d6999f3aa1e574cc45619c5ec7b52592d42e61/assets/logo.png" alt="Logo" width="36" height="36" loading="lazy">
    <div class="topbar-logo-text">
      <span class="site-name">Singularity University</span>
