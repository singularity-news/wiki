      - name: Geaenderte Seiten rendern
        if: steps.changes.outputs.count != '0'
        env:
          PAGES_FILE: ${{ steps.changes.outputs.pages_file }}
        run: |
          set -euo pipefail
          ERRORS=0

          while IFS= read -r TITLE || [[ -n "${TITLE:-}" ]]; do
            [[ -z "${TITLE// }" ]] && continue

            SAFE="$(python3 - "$TITLE" <<'PY'
import re, sys, unicodedata
title = sys.argv[1].strip().replace(" ", "_")
title = unicodedata.normalize("NFKD", title).encode("ascii", "ignore").decode("ascii")
title = re.sub(r'[^A-Za-z0-9_-]+', '', title)
title = re.sub(r'_+', '_', title).strip('_')
print(title)
PY
)"

            if [[ -z "$SAFE" ]]; then
              SAFE="page-$(printf '%s' "$TITLE" | sha256sum | cut -c1-8)"
            fi

            FILE="${SAFE}.html"

            ENCODED_TITLE="$(python3 - "$TITLE" <<'PY'
import sys, urllib.parse
print(urllib.parse.quote(sys.argv[1], safe=""))
PY
)"

            if ! RAW_HTML="$(curl -fsSL --retry 3 --retry-delay 2 --max-time 30 \
              "${WIKI_API}?action=parse&page=${ENCODED_TITLE}&prop=text&format=json" \
              | jq -r '.parse.text["*"] // empty')"; then
              RAW_HTML=""
            fi

            if [[ -z "$RAW_HTML" ]]; then
              echo "Warnung: Konnte '$TITLE' nicht rendern - uebersprungen."
              ERRORS=$((ERRORS + 1))
              continue
            fi

            TITLE_ESC="$(python3 - "$TITLE" <<'PY'
import html, sys
print(html.escape(sys.argv[1], quote=True))
PY
)"

            DESC="$(printf '%s' "$RAW_HTML" \
              | sed 's/<[^>]*>/ /g' \
              | tr '\n' ' ' \
              | sed 's/[[:space:]]\+/ /g' \
              | cut -c1-300)"

            DESC_ESC="$(python3 - "$DESC" <<'PY'
import html, sys
print(html.escape(sys.argv[1], quote=True))
PY
)"

            SOURCE_PAGE_URL="${SOURCE_WIKI_URL}/index.php?title=${ENCODED_TITLE}"
            CANONICAL_URL="${SITE_URL}/${SAFE}.html"

            cat > "$FILE" <<EOF
