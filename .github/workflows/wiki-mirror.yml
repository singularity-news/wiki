name: MediaWiki → GitHub Pages Root Mirror (DIAGNOSE)

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update -q
          sudo apt-get install -y jq curl python3

      - name: Diagnose – Seitenliste erzwingen
        run: |
          API="https://wiki.free.nf/api.php"
          curl -s -H "User-Agent: Mozilla/5.0" \
            "$API?action=query&list=allpages&aplimit=10&format=json" \
            | jq -r '.query.allpages[].title' > pages.txt
          wc -l pages.txt
          cat pages.txt

      - name: Diagnose – Eine Seite rendern
        run: |
          API="https://wiki.free.nf/api.php"
          while read -r TITLE; do
            echo "Rendere: $TITLE"

            ENCODED=$(python3 - "$TITLE" <<'EOF'
import urllib.parse, sys
print(urllib.parse.quote(sys.argv[1]))
EOF
)

            URL="$API?action=parse&page=$ENCODED&prop=text&format=json"

            RAW=$(curl -s -H "User-Agent: Mozilla/5.0" "$URL")
            HTML=$(echo "$RAW" | jq -r '.parse.text["*"] // "<!-- EMPTY -->"')

            echo "HTML-Länge: ${#HTML}"

            echo "<html><body><h1>$TITLE</h1>$HTML</body></html>" > test.html
            break
          done < pages.txt

      - name: Commit Testdatei
        run: |
          git config user.name "wiki-mirror-bot"
          git config user.email "bot@users.noreply.github.com"
          git add test.html pages.txt
          git commit -m "Diagnose: render test page" || exit 0
          git push
