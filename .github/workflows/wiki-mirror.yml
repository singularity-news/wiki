HTMLEOF

            echo "✓ Gerendert: $FILE"
          done < pages.txt

          if [ $ERRORS -gt 0 ]; then
            echo "⚠ $ERRORS Seite(n) konnten aufgrund von Fehlern nicht gerendert werden."
          fi

      # ── 5. search-index.json aktualisieren ────────
      - name: search-index.json aktualisieren
        if: steps.changes.outputs.count != '0'
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          echo "[" > search-index.json
          FIRST=1

          # Alle HTML-Dateien (außer Systemdateien) für den Suchindex erfassen
          find . -maxdepth 1 -name "*.html" ! -name "index.html" ! -name "template.html" | sort | while read HTMLFILE; do
            FILENAME=$(basename "$HTMLFILE")
            SAFE="${FILENAME%.html}"
            TITLE=$(echo "$SAFE" | tr '_' ' ')

            # Exzerpt erstellen: HTML-Tags entfernen, Zeilenumbrüche glätten, auf 300 Zeichen kürzen
            EXCERPT=$(sed 's/<[^>]*>//g' "$HTMLFILE" | grep -v '^[[:space:]]*$' | head -30 | tr '\n' ' ' | sed 's/  */ /g' | cut -c1-300)
            
            # JSON-gerechtes Escaping für Anführungszeichen und Backslashes
            EXCERPT_J=$(echo "$EXCERPT" | sed 's/\\/\\\\/g; s/"/\\"/g')
            TITLE_J=$(echo "$TITLE"   | sed 's/\\/\\\\/g; s/"/\\"/g')

            if [ "$FIRST" -eq 1 ]; then
              FIRST=0
            else
              echo "," >> search-index.json
            fi

            cat >> search-index.json <<JSONEOF
  {"title":"${TITLE_J}","file":"${FILENAME}","text":"${EXCERPT_J}","date":"${TODAY}"}
JSONEOF
          done

          echo "]" >> search-index.json
          echo "✓ search-index.json erfolgreich aktualisiert."

      # ── 6. sitemap.xml neu erzeugen ───────────────
      - name: sitemap.xml aktualisieren
        if: steps.changes.outputs.count != '0'
        run: |
          TODAY=$(date -u +"%Y-%m-%d")

          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            echo "  <url><loc>https://singularity-news.github.io/</loc><changefreq>daily</changefreq><priority>1.0</priority></url>"

            find . -maxdepth 1 -name "*.html" ! -name "index.html" ! -name "template.html" | sort | while read f; do
              FILE=$(basename "$f")
              echo "  <url><loc>https://singularity-news.github.io/${FILE}</loc><lastmod>${TODAY}</lastmod><changefreq>weekly</changefreq><priority>0.8</priority></url>"
            done

            echo '</urlset>'
          } > sitemap.xml

          echo "✓ sitemap.xml erfolgreich aktualisiert."

      # ── 7. Sync-Zeitpunkt speichern ───────────────
      - name: Sync-Zeitpunkt speichern
        if: steps.changes.outputs.count != '0'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last_sync
          echo "✓ .last_sync Zeitstempel aktualisiert."

      # ── 8. Commit & Push ──────────────────────────
      - name: Änderungen committen und pushen
        if: steps.changes.outputs.count != '0'
        run: |
          git config user.name  "wiki-mirror-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .
          
          if git diff --staged --quiet; then
            echo "Keine relevanten Änderungen festgestellt. Skip Push."
          else
            CHANGED_FILES=$(git diff --staged --name-only | wc -l | tr -d ' ')
            git commit -m "Auto-Sync: ${CHANGED_FILES} Dateien aktualisiert [$(date -u +"%Y-%m-%d %H:%M UTC")]"
            git push
            echo "✓ Änderungen erfolgreich auf GitHub gepusht."
          fi
