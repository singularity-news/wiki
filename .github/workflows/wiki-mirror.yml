name: Wiki XML → HTML Encyclopedia

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pandoc python3

      - name: Build encyclopedia from backup/wiki.xml
        run: |
          python3 <<'PY'
          import os, re, json, html, unicodedata, sys
          import xml.etree.ElementTree as ET
          from collections import Counter

          XML = "backup/wiki.xml"
          TEMPLATE_PATH = "template.html"
          BASE = "https://singularity-news.github.io/wiki"

          if not os.path.isfile(XML):
              print("ERROR: backup/wiki.xml not found", file=sys.stderr)
              sys.exit(2)
          if not os.path.isfile(TEMPLATE_PATH):
              print("ERROR: template.html not found", file=sys.stderr)
              sys.exit(2)

          template = open(TEMPLATE_PATH, encoding="utf-8").read()
          if "{html_body}" not in template:
              print("ERROR: template.html must contain {html_body}", file=sys.stderr)
              sys.exit(2)

          def strip_ns(tag):
              return tag.split("}", 1)[-1]

          def safe_filename(title):
              t = unicodedata.normalize("NFKC", title)
              t = re.sub(r"[^\w\- ]+", "", t).replace(" ", "_")
              return f"{t}.html" if t else "Untitled.html"

          pages = []
          for _, elem in ET.iterparse(XML, events=("end",)):
              if strip_ns(elem.tag) == "page":
                  title_el = elem.find(".//{*}title")
                  text_el  = elem.find(".//{*}text")
                  if title_el is not None and text_el is not None:
                      pages.append((title_el.text.strip(), text_el.text or ""))
                  elem.clear()

          if not pages:
              print("ERROR: No pages parsed", file=sys.stderr)
              sys.exit(3)

          for i, (title, wikitext) in enumerate(pages, 1):
              fn = safe_filename(title)
              open("/tmp/page.wiki", "w", encoding="utf-8").write(wikitext)
              os.system(f'pandoc /tmp/page.wiki -f mediawiki -t html -o /tmp/page.html')

              fragment = open("/tmp/page.html", encoding="utf-8").read()
              page_html = template.replace("{html_body}", fragment)
              page_html = page_html.replace("{title_esc}", html.escape(title))
              page_html = page_html.replace("{desc_esc}", html.escape(title))
              page_html = page_html.replace("{page_url}", f"{BASE}/{fn}")
              page_html = page_html.replace("{schema}", "")

              open(fn, "w", encoding="utf-8").write(page_html)

          print("HTML generation complete.")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
