      <article class="article-body">
        <h1>${TITLE_ESC}</h1>
        <div class="article-meta">
          <span>Quelle: <a href="https://wiki.free.nf/index.php?title=${ENCODED_TITLE}" target="_blank" rel="noopener">MediaWiki</a></span>
