name: MediaWiki to GitHub Pages Root Mirror

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

env:
  # Erleichtert den Übergang zu Node.js 24 und entfernt die Deprecation-Warnung
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Abhaengigkeiten installieren
        run: |
          sudo apt-get update -q
          sudo apt-get install -y jq curl python3

      - name: Aenderungen pruefen
        id: changes
        run: |
          API="https://wiki.free.nf/api.php"
          SINCE_FILE=".last_sync"

          if [ -f "$SINCE_FILE" ]; then
            SINCE=$(cat "$SINCE_FILE")
          else
            SINCE="1970-01-01T00:00:00Z"
          fi

          echo "Pruefe Aenderungen seit: $SINCE"

          RESPONSE=$(curl -s --max-time 30 \
            "$API?action=query&list=recentchanges&rcprop=title|timestamp&rclimit=100&format=json")

          if [ -z "$RESPONSE" ] || ! echo "$RESPONSE" | jq -e '.query' > /dev/null 2>&1; then
            echo "Wiki nicht erreichbar. Abbruch."
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "$RESPONSE" > recent.json

          COUNT=$(jq "[.query.recentchanges[] | select(.timestamp > \"$SINCE\")] | length" recent.json)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Geaenderte Seiten: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            jq -r ".query.recentchanges[] | select(.timestamp > \"$SINCE\") | .title" recent.json \
              | grep -v -E '^(Special:|MediaWiki:|File:|Template:|Category:)' \
              | sort -u > pages.txt
            echo "Artikel zur Aktualisierung:"
            cat pages.txt
          fi

      - name: Geaenderte Seiten rendern
        if: steps.changes.outputs.count != '0'
        run: |
          API="https://wiki.free.nf/api.php"
          ERRORS=0

          while IFS= read -r TITLE || [[ -n "$TITLE" ]]; do
            [ -z "$TITLE" ] && continue

            SAFE=$(echo "$TITLE" | tr ' ' '_' | sed 's/[^a-zA-Z0-9_aeoeueAEOEUEss-]//g')
            FILE="${SAFE}.html"

            RAW_HTML=$(curl -s --max-time 30 \
              "$API?action=parse&page=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TITLE")&prop=text&format=json" \
              | jq -r '.parse.text["*"] // empty')

            if [ -z "$RAW_HTML" ]; then
              echo "Warnung: Konnte '$TITLE' nicht rendern."
              ERRORS=$((ERRORS+1))
              continue
            fi

            TITLE_ESC=$(echo "$TITLE" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')
            DESC=$(echo "$RAW_HTML" | sed 's/<[^>]*>//g' | tr '\n' ' ' | sed 's/  */ /g' | cut -c1-300)
            DESC_ESC=$(echo "$DESC" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')

            cat > "$FILE" <<EOF
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${TITLE_ESC} — Singularity University Wiki</title>
<meta name="description" content="${DESC_ESC}">
<link rel="canonical" href="https://singularity-news.github.io/${SAFE}.html">
<link rel="stylesheet" href="assets/style.css">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Article","headline":"${TITLE_ESC}","description":"${DESC_ESC}"}
</script>
</head>
<body>
<header class="topbar">
  <div class="topbar-logo">Singularity University Wiki</div>
</header>
<main class="article-main">
  <article class="article-body">
    <h1>${TITLE_ESC}</h1>
    ${RAW_HTML}
  </article>
</main>
<script src="assets/app.js"></script>
</body>
</html>
EOF
            echo "✓ $FILE"
          done < pages.txt

      - name: search-index.json aktualisieren
        if: steps.changes.outputs.count != '0'
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          echo "[" > search-index.json
          FIRST=1
          find . -maxdepth 1 -name "*.html" ! -name "index.html" | sort | while read HTMLFILE; do
            FILENAME=$(basename "$HTMLFILE")
            TITLE=$(echo "${FILENAME%.html}" | tr '_' ' ')
            EXCERPT=$(sed 's/<[^>]*>//g' "$HTMLFILE" | head -c 300 | tr '"' "'")
            
            [ "$FIRST" -eq 0 ] && echo "," >> search-index.json
            echo "{\"title\":\"$TITLE\",\"file\":\"$FILENAME\",\"text\":\"$EXCERPT\",\"date\":\"$TODAY\"}" >> search-index.json
            FIRST=0
          done
          echo "]" >> search-index.json

      - name: sitemap.xml aktualisieren
        if: steps.changes.outputs.count != '0'
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          echo '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' > sitemap.xml
          find . -maxdepth 1 -name "*.html" ! -name "index.html" | sort | while read f; do
            echo "<url><loc>https://singularity-news.github.io/$(basename "$f")</loc><lastmod>$TODAY</lastmod></url>" >> sitemap.xml
          done
          echo '</urlset>' >> sitemap.xml

      - name: Sync-Zeitpunkt speichern
        if: steps.changes.outputs.count != '0'
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > .last_sync

      - name: Aenderungen committen und pushen
        if: steps.changes.outputs.count != '0'
        run: |
          git config user.name "wiki-mirror-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Auto-Sync [$(date -u +'%Y-%m-%d %H:%M')]"
            git push
          fi
