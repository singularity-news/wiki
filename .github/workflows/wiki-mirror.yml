name: Wiki XML → HTML Encyclopedia

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pandoc python3

      - name: Debug — workspace and key files
        run: |
          echo "=== workspace root ==="
          ls -la .
          echo "=== backup directory ==="
          ls -la backup || true
          echo "=== head backup/wiki.xml ==="
          head -n 20 backup/wiki.xml || true
          echo "=== head template.html ==="
          head -n 40 template.html || true

      - name: Build encyclopedia from backup/wiki.xml
        env:
          PAGES_BASE: ${{ secrets.PAGES_BASE || '' }}
        run: python3 build.py

      - name: Show generated files
        run: |
          echo "=== HTML files (first 30) ==="
          ls *.html 2>/dev/null | head -30 || true
          echo "=== Total HTML files ==="
          ls *.html 2>/dev/null | wc -l || true
          echo "=== Other outputs ==="
          ls -la search-index.json sitemap.xml robots.txt 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
