# .github/workflows/wiki-mirror.yml

name: MediaWiki → GitHub Pages Root Mirror

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update -q
          sudo apt-get install -y jq curl python3

      - name: Änderungen prüfen
        id: changes
        run: |
          API="https://wiki.free.nf/api.php"
          SINCE_FILE=".last_sync"

          if [ -f "$SINCE_FILE" ]; then
            SINCE=$(cat "$SINCE_FILE")
          else
            SINCE="1970-01-01T00:00:00Z"
          fi

          RESPONSE=$(curl -s --max-time 30 \
            "$API?action=query&list=recentchanges&rcprop=title|timestamp&rclimit=100&format=json")

          if [ -z "$RESPONSE" ] || ! echo "$RESPONSE" | jq -e '.query' > /dev/null 2>&1; then
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "$RESPONSE" > recent.json

          COUNT=$(jq "[.query.recentchanges[] | select(.timestamp > \"$SINCE\")] | length" recent.json)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

          if [ "$COUNT" -gt 0 ]; then
            jq -r ".query.recentchanges[] | select(.timestamp > \"$SINCE\") | .title" recent.json \
              | grep -v '^Special:' \
              | grep -v '^MediaWiki:' \
              | grep -v '^File:' \
              | grep -v '^Template:' \
              | grep -v '^Category:' \
              | sort -u > pages.txt
          fi

      - name: Geänderte Seiten rendern
        if: steps.changes.outputs.count != '0'
        run: |
          API="https://wiki.free.nf/api.php"
          ERRORS=0

          while IFS= read -r TITLE; do
            [ -z "$TITLE" ] && continue

            SAFE=$(echo "$TITLE" | tr ' ' '_' | sed 's/[^a-zA-Z0-9_äöüÄÖÜß-]//g')
            FILE="${SAFE}.html"

            ENCODED_TITLE=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TITLE")

            RAW_HTML=$(curl -s --max-time 30 \
              "$API?action=parse&page=${ENCODED_TITLE}&prop=text&format=json" \
              | jq -r '.parse.text["*"] // empty')

            if [ -z "$RAW_HTML" ]; then
              ERRORS=$((ERRORS+1))
              continue
            fi

            TITLE_ESC=$(echo "$TITLE" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')

            DESC=$(echo "$RAW_HTML" | sed 's/<[^>]*>//g' | tr '\n' ' ' | sed 's/  */ /g' | cut -c1-300)
            DESC_ESC=$(echo "$DESC" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')

            cat <<'HTMLEOF' > "$FILE"
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="D-u4byZG_DrIUxnTLQdS0BOTjJcwWmm_h-HwUXl8HO4">
<title>${TITLE_ESC} — Singularity University Wiki</title>
<meta name="description" content="${DESC_ESC}">
<link rel="canonical" href="https://singularity-news.github.io/${SAFE}.html">
</head>
<body>
<h1>${TITLE_ESC}</h1>
<div>
Quelle: <a href="https://wiki.free.nf/index.php?title=${ENCODED_TITLE}" target="_blank">MediaWiki</a>
</div>
<div>
${RAW_HTML}
</div>
</body>
</html>
HTMLEOF

            echo "Rendered: $FILE"
          done < pages.txt

      - name: search-index.json aktualisieren
        if: steps.changes.outputs.count != '0'
        run: |
          TODAY=$(date -u +"%Y-%m-%d")

          echo "[" > search-index.json
          FIRST=1

          for HTMLFILE in *.html; do
            [ "$HTMLFILE" = "index.html" ] && continue

            TITLE=$(basename "$HTMLFILE" .html | tr '_' ' ')
            EXCERPT=$(sed 's/<[^>]*>//g' "$HTMLFILE" | head -n 20 | tr '\n' ' ' | cut -c1-300)

            if [ "$FIRST" -eq 1 ]; then
              FIRST=0
            else
              echo "," >> search-index.json
            fi

            echo "{\"title\":\"$TITLE\",\"file\":\"$HTMLFILE\",\"text\":\"$EXCERPT\",\"date\":\"$TODAY\"}" >> search-index.json
          done

          echo "]" >> search-index.json

      - name: sitemap.xml aktualisieren
        if: steps.changes.outputs.count != '0'
        run: |
          TODAY=$(date -u +"%Y-%m-%d")

          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml

          for f in *.html; do
            echo "<url><loc>https://singularity-news.github.io/$f</loc><lastmod>$TODAY</lastmod></url>" >> sitemap.xml
          done

          echo '</urlset>' >> sitemap.xml

      - name: Sync speichern
        if: steps.changes.outputs.count != '0'
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > .last_sync

      - name: Commit & Push
        if: steps.changes.outputs.count != '0'
        run: |
          git config user.name "wiki-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .

          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Auto Sync $(date -u)"
            git push
          fi
