# .github/workflows/wiki-mirror.yml
# =====================================================
# Singularity University — MediaWiki → GitHub Pages
# Root Mirror (Model B)
#
# Runs 2× daily (00:00 and 12:00 UTC)
# Renders only changed pages as flat HTML files
# Updates sitemap.xml and search-index.json
# No backend, webhook, or PHP required
# =====================================================

name: MediaWiki to GitHub Pages Root Mirror

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ─────────────────────────────────────────────
      # 1. Checkout repository
      # ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────────
      # 2. Install dependencies
      # ─────────────────────────────────────────────
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y jq curl python3

      # ─────────────────────────────────────────────
      # 3. Check for wiki changes
      # ─────────────────────────────────────────────
      - name: Check for changes
        id: changes
        run: |
          API="https://wiki.free.nf/api.php"
          SINCE_FILE=".last_sync"

          if [ -f "$SINCE_FILE" ]; then
            SINCE=$(cat "$SINCE_FILE")
          else
            SINCE="1970-01-01T00:00:00Z"
          fi

          echo "Checking changes since: $SINCE"

          RESPONSE=$(curl -s --max-time 30 \
            "$API?action=query&list=recentchanges&rcprop=title|timestamp&rclimit=100&format=json")

          if [ -z "$RESPONSE" ] || ! echo "$RESPONSE" | jq -e '.query' > /dev/null 2>&1; then
            echo "Wiki unavailable. Abort."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$RESPONSE" > recent.json

          COUNT=$(jq "[.query.recentchanges[] | select(.timestamp > \"$SINCE\")] | length" recent.json)

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Changed pages: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            jq -r ".query.recentchanges[] | select(.timestamp > \"$SINCE\") | .title" recent.json \
              | grep -v '^Special:' \
              | grep -v '^MediaWiki:' \
              | grep -v '^File:' \
              | grep -v '^Template:' \
              | grep -v '^Category:' \
              | sort -u > pages.txt

            echo "Pages queued for rendering:"
            cat pages.txt
          fi

      # ─────────────────────────────────────────────
      # 4. Render changed pages
      # ─────────────────────────────────────────────
      - name: Render changed pages
        if: steps.changes.outputs.count != '0'
        run: |
          API="https://wiki.free.nf/api.php"
          ERRORS=0

          while IFS= read -r TITLE; do

            [ -z "$TITLE" ] && continue

            SAFE=$(echo "$TITLE" | tr ' ' '_' | sed 's/[^a-zA-Z0-9_äöüÄÖÜß-]//g')
            FILE="${SAFE}.html"

            ENCODED_TITLE=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TITLE")

            RAW_HTML=$(curl -s --max-time 30 \
              "$API?action=parse&page=${ENCODED_TITLE}&prop=text&format=json" \
              | jq -r '.parse.text["*"] // empty')

            if [ -z "$RAW_HTML" ]; then
              echo "Could not render '$TITLE' — skipped."
              ERRORS=$((ERRORS+1))
              continue
            fi

            TITLE_ESC=$(echo "$TITLE" \
              | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')

            DESC=$(echo "$RAW_HTML" \
              | sed 's/<[^>]*>//g' \
              | tr '\n' ' ' \
              | sed 's/  */ /g' \
              | cut -c1-300)

            DESC_ESC=$(echo "$DESC" \
              | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')

            cat > "$FILE" <<'HTMLEOF'
<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="google-site-verification" content="D-u4byZG_DrIUxnTLQdS0BOTjJcwWmm_h-HwUXl8HO4">

<title>${TITLE_ESC} — Singularity University Wiki</title>

<meta name="description" content="${DESC_ESC}">
<meta name="robots" content="index, follow">

<link rel="canonical" href="https://singularity-news.github.io/${SAFE}.html">

<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">

<meta property="og:type" content="article">
<meta property="og:title" content="${TITLE_ESC} — Singularity University Wiki">
<meta property="og:description" content="${DESC_ESC}">
<meta property="og:image" content="https://raw.githubusercontent.com/singularity-news/wiki/57d6999f3aa1e574cc45619c5ec7b52592d42e61/assets/header.png">
<meta property="og:url" content="https://singularity-news.github.io/${SAFE}.html">

<meta name="twitter:card" content="summary_large_image">

<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"Article",
  "headline":"${TITLE_ESC}",
  "url":"https://singularity-news.github.io/${SAFE}.html",
  "description":"${DESC_ESC}",
  "publisher":{
    "@type":"Organization",
    "name":"Singularity University Wiki",
    "url":"https://singularity-news.github.io/"
  }
}
</script>

<link rel="stylesheet" href="assets/style.css">

</head>

<body>

<div class="overlay" id="overlay" aria-hidden="true"></div>

<header class="topbar" role="banner">

  <button class="icon-btn"
          id="menuToggle"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="sidebar">

    <svg width="18"
         height="18"
         viewBox="0 0 18 18"
         fill="currentColor"
         aria-hidden="true">

      <rect y="2" width="18" height="2" rx="1"/>
      <rect y="8" width="18" height="2" rx="1"/>
      <rect y="14" width="18" height="2" rx="1"/>

    </svg>

  </button>

  <a href="index.html" class="topbar-logo">

    <img
      src="https://raw.githubusercontent.com/singularity-news/wiki/57d6999f3aa1e574cc45619c5ec7b52592d42e61/assets/logo.png"
      alt="Logo"
      width="36"
      height="36"
      loading="lazy">

    <div class="topbar-logo-text">
      <span class="site-name">Singularity University</span>
      <span class="site-sub">KdK Krzb. Online Wiki</span>
    </div>

  </a>

</header>

<div class="page-wrap">

  <main class="article-main">

    <article class="article-body">

      <h1>${TITLE_ESC}</h1>

      <div class="article-meta">

        <span>
          Source:
          <a href="https://wiki.free.nf/index.php?title=${ENCODED_TITLE}"
             target="_blank"
             rel="noopener">
             MediaWiki
          </a>
        </span>

      </div>

      ${RAW_HTML}

    </article>

  </main>

  <footer class="footer" role="contentinfo">

    <p>
      © 2026 Singularity University Wiki

      <span class="footer-sep">·</span>

      <a href="https://github.com/singularity-news/wiki"
         target="_blank"
         rel="noopener">
         GitHub
      </a>

      <span class="footer-sep">·</span>

      <a href="sitemap.xml">Sitemap</a>
    </p>

  </footer>

</div>

<script src="assets/app.js"></script>

</body>
</html>
HTMLEOF

            echo "Rendered: $FILE"

          done < pages.txt

          if [ "$ERRORS" -gt 0 ]; then
            echo "$ERRORS page(s) could not be rendered."
          fi

      # ─────────────────────────────────────────────
      # 5. Update search-index.json
      # ─────────────────────────────────────────────
      - name: Update search-index.json
        if: steps.changes.outputs.count != '0'
        run: |
          TODAY=$(date -u +"%Y-%m-%d")

          echo "[" > search-index.json

          FIRST=1

          find . -maxdepth 1 -name "*.html" \
            ! -name "index.html" \
            ! -name "template.html" \
            | sort | while read HTMLFILE; do

            FILENAME=$(basename "$HTMLFILE")
            SAFE="${FILENAME%.html}"

            TITLE=$(echo "$SAFE" | tr '_' ' ')

            EXCERPT=$(sed 's/<[^>]*>//g' "$HTMLFILE" \
              | grep -v '^[[:space:]]*$' \
              | head -30 \
              | tr '\n' ' ' \
              | sed 's/  */ /g' \
              | cut -c1-300)

            EXCERPT_J=$(echo "$EXCERPT" | sed 's/\\/\\\\/g; s/"/\\"/g')
            TITLE_J=$(echo "$TITLE" | sed 's/\\/\\\\/g; s/"/\\"/g')

            if [ "$FIRST" -eq 1 ]; then
              FIRST=0
            else
              echo "," >> search-index.json
            fi

            echo "{\"title\":\"${TITLE_J}\",\"file\":\"${FILENAME}\",\"text\":\"${EXCERPT_J}\",\"date\":\"${TODAY}\"}" >> search-index.json

          done

          echo "]" >> search-index.json

          echo "search-index.json updated."

      # ─────────────────────────────────────────────
      # 6. Update sitemap.xml
      # ─────────────────────────────────────────────
      - name: Update sitemap.xml
        if: steps.changes.outputs.count != '0'
        run: |
          TODAY=$(date -u +"%Y-%m-%d")

          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'

            echo '  <url>'
            echo '    <loc>https://singularity-news.github.io/</loc>'
            echo '    <changefreq>daily</changefreq>'
            echo '    <priority>1.0</priority>'
            echo '  </url>'

            find . -maxdepth 1 -name "*.html" \
              ! -name "index.html" \
              ! -name "template.html" \
              | sort | while read f; do

              FILE=$(basename "$f")

              echo '  <url>'
              echo "    <loc>https://singularity-news.github.io/${FILE}</loc>"
              echo "    <lastmod>${TODAY}</lastmod>"
              echo '    <changefreq>weekly</changefreq>'
              echo '    <priority>0.8</priority>'
              echo '  </url>'

            done

            echo '</urlset>'

          } > sitemap.xml

          echo "sitemap.xml updated."

      # ─────────────────────────────────────────────
      # 7. Save sync timestamp
      # ─────────────────────────────────────────────
      - name: Save sync timestamp
        if: steps.changes.outputs.count != '0'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last_sync
          echo ".last_sync updated."

      # ─────────────────────────────────────────────
      # 8. Commit and push
      # ─────────────────────────────────────────────
      - name: Commit and push changes
        if: steps.changes.outputs.count != '0'
        run: |
          git config user.name "wiki-mirror-bot"
          git config user.email "bot@users.noreply.github.com"

          git add .

          if git diff --staged --quiet; then
            echo "No repository changes detected."
          else
            CHANGED=$(git diff --staged --name-only | wc -l | tr -d ' ')

            git commit -m "Auto-Sync: ${CHANGED} file(s) updated [$(date -u +"%Y-%m-%d %H:%M UTC")]"

            git push

            echo "Push successful."
          fi
