name: Wiki XML → HTML Encyclopedia

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pandoc python3

      - name: Build encyclopedia
        run: |
          python3 <<'PY'
          import os, re, json, html, unicodedata
          import xml.etree.ElementTree as ET
          from collections import Counter

          XML = "backup/wiki.xml"
          TEMPLATE = open("template.html", encoding="utf-8").read()
          BASE = "https://singularity-news.github.io/wiki"

          # Namespace-agnostic tag stripper
          def strip_ns(tag):
              return tag.split("}", 1)[-1]

          STOP = set("der die das und oder ein eine the and or for with from".split())

          def safe(t):
              t = unicodedata.normalize("NFKC", t)
              t = re.sub(r"[^\w\- ]+", "", t)
              return (t.replace(" ", "_") or "Untitled") + ".html"

          def strip_tags(s):
              s = re.sub(r"<[^>]+>", " ", s)
              return re.sub(r"\s+", " ", html.unescape(s)).strip()

          def keywords(text):
              words = re.findall(r"[A-Za-z0-9]{3,}", text.lower())
              return [w for w,_ in Counter(w for w in words if w not in STOP).most_common(10)]

          pages = []

          # Parse ANY MediaWiki XML version
          for event, elem in ET.iterparse(XML, events=("end",)):
              if strip_ns(elem.tag) == "page":
                  title_el = elem.find(".//{*}title")
                  text_el = elem.find(".//{*}text")
                  title = (title_el.text or "").strip() if title_el is not None else ""
                  text = text_el.text or "" if text_el is not None else ""
                  if title:
                      pages.append((title, text))
                  elem.clear()

          print("Parsed pages:", len(pages))

          if not pages:
              raise SystemExit("ERROR: No pages parsed. Check XML namespace.")

          # Build title → filename map
          title_map = {}
          for t,_ in pages:
              fn = safe(t)
              title_map[t] = fn
              title_map[t.replace(" ", "_")] = fn

          search = []

          for i,(title,wikitext) in enumerate(pages,1):
              fn = safe(title)

              tmp_in = f"/tmp/{i}.wiki"
              tmp_out = f"/tmp/{i}.html"
              open(tmp_in,"w",encoding="utf-8").write(wikitext)
              os.system(f'pandoc "{tmp_in}" -f mediawiki -t html --wrap=none -o "{tmp_out}"')

              body = open(tmp_out,encoding="utf-8").read()

              # Rewrite internal links
              def repl(m):
                  href = m.group(1)
                  key = href.split("#",1)[0].split("?",1)[0].replace(" ", "_")
                  return f'href="{title_map.get(key, href)}"'
              body = re.sub(r'href="([^"]+)"', repl, body)

              plain = strip_tags(body)
              desc = plain[:300]
              keys = keywords(plain)
              canonical = f"{BASE}/{fn}"

              page = TEMPLATE.replace("{{CONTENT}}", body)
              page = page.replace("</head>", f"""
              <title>{html.escape(title)}</title>
              <meta name="description" content="{html.escape(desc)}">
              <meta name="keywords" content="{', '.join(keys)}">
              <link rel="canonical" href="{canonical}">
              </head>""")

              open(fn,"w",encoding="utf-8").write(page)

              search.append({"title":title,"file":fn,"text":plain[:20000]})

          json.dump(search, open("search-index.json","w",encoding="utf-8"), ensure_ascii=False, indent=2)

          # Sitemap
          html_files = [f for f in os.listdir(".") if f.endswith(".html")]
          sm = ['<?xml version="1.0" encoding="UTF-8"?>',
                '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for f in html_files:
              sm.append(f"<url><loc>{BASE}/{f}</loc></url>")
          sm.append("</urlset>")
          open("sitemap.xml","w").write("\n".join(sm))

          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
