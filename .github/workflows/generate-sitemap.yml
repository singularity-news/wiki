name: Generate sitemap
on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run sitemap generator inline
        run: |
          python3 - <<'PY'
          import os, sys, html, math
          from datetime import datetime, timezone

          # Simple example: write a tiny sitemap.xml for demo
          urls = [
              "https://example.com/",
              "https://example.com/about",
              "https://example.com/blog"
          ]

          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          sitemap = ['<?xml version="1.0" encoding="UTF-8"?>',
                     '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for u in urls:
              sitemap.append("  <url>")
              sitemap.append(f"    <loc>{html.escape(u)}</loc>")
              sitemap.append(f"    <lastmod>{now}</lastmod>")
              sitemap.append("  </url>")
          sitemap.append("</urlset>")

          out_path = "sitemap.xml"
          with open(out_path, "w", encoding="utf-8") as f:
              f.write("\n".join(sitemap))
          print(f"✨ Wrote {out_path} with {len(urls)} URLs")
          PY
