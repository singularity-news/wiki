name: Generate sitemap
on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run sitemap generator inline
        run: |
          python3 - <<'PY'
          import html
          from datetime import datetime, timezone
          urls = ["https://example.com/","https://example.com/about","https://example.com/blog"]
          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          sitemap = ['<?xml version="1.0" encoding="UTF-8"?>','<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for u in urls:
              sitemap += ["  <url>", f"    <loc>{html.escape(u)}</loc>", f"    <lastmod>{now}</lastmod>", "  </url>"]
          sitemap.append("</urlset>")
          with open("sitemap.xml","w",encoding="utf-8") as f:
              f.write("\n".join(sitemap))
          print(f"✨ Wrote sitemap.xml with {len(urls)} URLs")
          PY

      - name: Verify sitemap exists
        run: |
          ls -la
          head -n 40 sitemap.xml

      - name: Upload sitemap artifact
        uses: actions/upload-artifact@v4
        with:
          name: sitemap
          path: sitemap.xml
