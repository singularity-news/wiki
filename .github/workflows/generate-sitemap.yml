name: Generate sitemap
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Setze BASE_URL auf die öffentliche Basis deiner Seiten, z. B. https://example.com or GitHub Pages URL
  BASE_URL: 'https://example.com'
  # Auf 'true' setzen, wenn sitemap.xml automatisch in main committed werden soll
  COMMIT_SITEMAP: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate sitemap from repo files
        run: |
          python3 - <<'PY'
          import os, re, html, urllib.parse
          from datetime import datetime, timezone

          base = os.environ.get("BASE_URL", "https://example.com").rstrip("/")
          exts = {".md", ".markdown", ".html", ".htm"}
          urls = set()

          # include base root
          urls.add(base + "/")

          for root, dirs, files in os.walk("."):
              # skip .git and .github directories
              if root.startswith("./.git") or "/.github" in root:
                  continue
              for fn in files:
                  name, ext = os.path.splitext(fn)
                  if ext.lower() not in exts:
                      continue
                  rel = os.path.join(root, fn).lstrip("./")
                  # convert README/index to directory root, otherwise remove extension
                  if name.lower() in ("readme", "index"):
                      path = os.path.dirname(rel)
                  else:
                      path = os.path.splitext(rel)[0]
                  path = path.replace(os.sep, "/").strip("/")
                  path = re.sub(r'\s+', '-', path)
                  if path == "":
                      url = base + "/"
                  else:
                      # URL-encode path segments safely
                      segments = [urllib.parse.quote(p, safe='-._~') for p in path.split("/")]
                      url = base + "/" + "/".join(segments)
                  urls.add(url)

          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          sitemap = ['<?xml version="1.0" encoding="UTF-8"?>',
                     '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for u in sorted(urls):
              sitemap.append("  <url>")
              sitemap.append(f"    <loc>{html.escape(u)}</loc>")
              sitemap.append(f"    <lastmod>{now}</lastmod>")
              sitemap.append("  </url>")
          sitemap.append("</urlset>")

          out_path = "sitemap.xml"
          with open(out_path, "w", encoding="utf-8") as f:
              f.write("\n".join(sitemap))
          print(f"✨ Wrote {out_path} with {len(urls)} URLs")
          PY

      - name: Verify sitemap exists
        run: |
          echo "Working dir: $(pwd)"
          ls -la
          if [ -f sitemap.xml ]; then
            echo "sitemap.xml exists"
            head -n 80 sitemap.xml
          else
            echo "sitemap.xml not found"
            exit 1
          fi

      - name: Upload sitemap artifact
        uses: actions/upload-artifact@v4
        with:
          name: sitemap
          path: sitemap.xml

      - name: Commit sitemap to repo (optional)
        if: env.COMMIT_SITEMAP == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "CI: update generated sitemap"
            git push origin HEAD:main
          fi
