name: Generate sitemap and commit
on:
  push: 
    branches: [ main ]
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BASE_URL: 'https://singularity-news.github.io/wiki'
  COMMIT_SITEMAP: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate sitemap (map repo files to .html URLs)
        run: |
          python3 - <<'PY'
          import os, urllib.parse, html
          from datetime import datetime, timezone

          base = os.environ.get("BASE_URL", "https://example.com").rstrip("/")
          exts_md = {".md", ".markdown"}
          exts_html = {".html", ".htm"}
          urls = set()

          # include base index
          urls.add(base + "/index.html")

          for root, dirs, files in os.walk("."):
              # skip git and workflow internals
              if root.startswith("./.git") or "/.github" in root:
                  continue
              for fn in files:
                  if fn.startswith("."):
                      continue
                  name, ext = os.path.splitext(fn)
                  ext = ext.lower()
                  rel = os.path.join(root, fn).lstrip("./")
                  # skip files in .github or hidden folders
                  if rel.startswith(".github/"):
                      continue

                  # determine URL path
                  if ext in exts_md:
                      # map markdown -> same basename + .html
                      path = os.path.splitext(rel)[0]
                      url_path = path.replace(os.sep, "/")
                      # replace spaces with underscore (matches your examples)
                      url_path = url_path.replace(" ", "_")
                      url = f"{base}/{urllib.parse.quote(url_path, safe='-._~/')}.html"
                  elif ext in exts_html:
                      # keep html files as-is
                      url_path = rel.replace(os.sep, "/")
                      url_path = url_path.replace(" ", "_")
                      url = f"{base}/{urllib.parse.quote(url_path, safe='-._~/')}"
                  else:
                      continue

                  # normalize double slashes
                  url = url.replace("//wiki/", "/wiki/")
                  urls.add(url)

          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          sitemap = ['<?xml version="1.0" encoding="UTF-8"?>',
                     '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for u in sorted(urls):
              sitemap.append("  <url>")
              sitemap.append(f"    <loc>{html.escape(u)}</loc>")
              sitemap.append(f"    <lastmod>{now}</lastmod>")
              sitemap.append("  </url>")
          sitemap.append("</urlset>")

          out_path = "sitemap.xml"
          with open(out_path, "w", encoding="utf-8") as f:
              f.write("\n".join(sitemap))
          print(f"✨ Wrote {out_path} with {len(urls)} URLs")
          PY

      - name: Verify sitemap
        run: |
          echo "Working dir: $(pwd)"
          ls -la
          if [ -f sitemap.xml ]; then
            echo "sitemap.xml exists"
            head -n 120 sitemap.xml
          else
            echo "sitemap.xml not found"
            exit 1
          fi

      - name: Commit sitemap to main
        if: env.COMMIT_SITEMAP == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "CI: update generated sitemap"
            git push origin HEAD:main
          fi
